# Render Blueprint — 서버 1개, URL 2개 (플레이볼 + YASDAQ)
# https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: playball-kbo
    runtime: node
    plan: free
    # build:render 스크립트가 devDeps 설치 + nest/vite 빌드를 한 번에 처리
    buildCommand: npm run build:render
    startCommand: npm run start:prod
    healthCheckPath: /amm/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: postgres
      # DATABASE_URL — Supabase URI를 Render 대시보드에서 직접 입력
      # 최초 1회: scripts/supabase-reset.sql 실행 후 true → 배포 → false
      - key: DB_SYNCHRONIZE
        value: false
      - key: LIVE_STATS_ENABLED
        value: true
      - key: GAMES_SYNC_ENABLED
        value: true
      - key: MEME_SYNC_ENABLED
        value: true
      # 배포 후 실제 URL로 바꾸기 (예: https://playball-kbo.onrender.com)
      - key: PUBLIC_URL
        value: https://playball-kbo.onrender.com
