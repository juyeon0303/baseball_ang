<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="KBO 실시간 점수·중계·팬 커뮤니티">
    <meta name="theme-color" content="#0d3d56">
    <title>플레이볼 — 실시간 KBO</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #0a0e14;
            --surface: #151d2b;
            --surface2: #1c2738;
            --border: #2a3548;
            --text: #f0f4f8;
            --muted: #8b9cb3;
            --accent: #3d9ee5;
            --live: #3dba6a;
            --final: #6b7a90;
            --highlight: #f0c040;
            --danger: #e85d5d;
            --nav-h: 58px;
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            font-size: 15px;
            line-height: 1.5;
            padding-bottom: calc(var(--nav-h) + 12px);
        }
        .wrap { max-width: 440px; margin: 0 auto; padding: 14px 14px 0; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .logo { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.03em; }
        .logo span { color: var(--accent); }
        .head-meta { text-align: right; }
        .date-line { font-size: 0.68rem; color: var(--muted); }
        .live-pill {
            display: inline-block;
            margin-top: 2px;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            background: #1a2e22;
            color: var(--live);
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 10px;
        }
        .label {
            font-size: 0.66rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .hero-card {
            background: linear-gradient(160deg, #1a2840 0%, var(--surface) 100%);
            border: 1px solid #2f4568;
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .hero-card.watching { box-shadow: 0 0 0 2px var(--accent); }
        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .hero-inning { font-size: 0.78rem; color: var(--muted); }
        .status-badge {
            font-size: 0.62rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--border);
            color: var(--muted);
        }
        .status-badge.live { background: #1e3d28; color: var(--live); }
        .status-badge.final { background: #2a3040; color: var(--final); }
        .matchup {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            text-align: center;
        }
        .team-name { font-size: 0.92rem; font-weight: 700; }
        .team-score {
            font-size: 2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .vs-dot { color: var(--muted); font-size: 0.8rem; }
        .match-meta {
            margin-top: 10px;
            font-size: 0.74rem;
            color: var(--muted);
            text-align: center;
        }
        .duel-line {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #101820;
            border: 1px solid var(--border);
            font-size: 0.8rem;
        }
        .duel-line strong { color: var(--highlight); }
        .play-now {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #101820;
            border-left: 3px solid var(--highlight);
            font-size: 0.82rem;
            line-height: 1.45;
        }
        .play-now .team { color: var(--highlight); font-weight: 700; }
        .seg {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            background: #101820;
            padding: 4px;
            border-radius: 10px;
        }
        .seg button {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 7px 4px;
            border-radius: 8px;
            cursor: pointer;
        }
        .seg button.on { background: var(--surface2); color: var(--text); }
        .game-card {
            display: block;
            width: 100%;
            text-align: left;
            border: 1px solid var(--border);
            background: var(--surface2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            color: inherit;
            cursor: pointer;
        }
        .game-card.active { border-color: var(--accent); }
        .game-card-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .game-card-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            font-weight: 600;
        }
        .game-card-score {
            font-size: 1.1rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .timeline {
            max-height: 320px;
            overflow-y: auto;
        }
        .tl-item {
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.8rem;
            line-height: 1.45;
        }
        .tl-item:last-child { border-bottom: none; }
        .tl-time { font-size: 0.65rem; color: var(--muted); margin-right: 6px; }
        .tl-team { color: var(--highlight); font-weight: 700; }
        .tl-impact.run { border-left: 2px solid var(--danger); padding-left: 8px; }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .team-pick {
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            border-radius: 12px;
            padding: 14px 10px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
        }
        .team-pick.on {
            border-color: var(--accent);
            background: #1a3050;
            color: var(--accent);
        }
        .my-game-box {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: #101820;
            border: 1px solid var(--border);
            font-size: 0.82rem;
        }
        .gaga-feed {
            max-height: 200px;
            overflow-y: auto;
            background: #101820;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 10px;
        }
        .gaga-msg { font-size: 0.76rem; padding: 5px 0; border-bottom: 1px dashed #2a3544; }
        .gaga-msg:last-child { border-bottom: none; }
        .gaga-msg.system { text-align: center; color: var(--muted); font-size: 0.7rem; }
        .gaga-msg.reaction { text-align: center; font-size: 1.1rem; }
        .gaga-msg.play .team { color: var(--highlight); font-weight: 600; }
        .gaga-user { font-weight: 600; margin-right: 4px; }
        .gaga-time { font-size: 0.6rem; color: var(--muted); margin-left: 4px; }
        .emoji-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .emoji-btn {
            border: 1px solid var(--border);
            background: var(--surface2);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .input-row { display: flex; gap: 6px; margin-top: 8px; }
        .chat-input, .nick-input {
            flex: 1;
            border: 1px solid var(--border);
            background: #101820;
            color: var(--text);
            padding: 9px 11px;
            border-radius: 8px;
            font-size: 0.82rem;
            outline: none;
        }
        .chat-send {
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
        }
        .empty {
            text-align: center;
            color: var(--muted);
            font-size: 0.82rem;
            padding: 24px 12px;
        }
        .stock-link {
            display: block;
            text-align: center;
            margin: 8px 0 4px;
            font-size: 0.72rem;
            color: var(--muted);
        }
        .stock-link a { color: var(--accent); text-decoration: none; }
        nav.bottom-nav {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: var(--nav-h);
            background: #0f1520ee;
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--border);
            display: flex;
            max-width: 440px;
            margin: 0 auto;
        }
        nav.bottom-nav button {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 0.68rem;
            font-weight: 600;
            padding-top: 6px;
            cursor: pointer;
        }
        nav.bottom-nav button .ico { display: block; font-size: 1.15rem; margin-bottom: 2px; }
        nav.bottom-nav button.on { color: var(--accent); }
        .toast {
            position: fixed;
            bottom: calc(var(--nav-h) + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: var(--accent);
            color: #fff;
            padding: 9px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 20;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div class="logo">플레이<span>볼</span></div>
            <div class="head-meta">
                <div class="date-line" id="date-line">—</div>
                <span class="live-pill" id="presence">—명 접속</span>
            </div>
        </header>

        <!-- 홈 -->
        <div class="tab-panel active" id="tab-home">
            <div class="label">지금 보는 경기</div>
            <div class="hero-card watching" id="hero-card" onclick="goTab('games')">
                <div class="hero-top">
                    <span class="hero-inning" id="hero-inning">—</span>
                    <span class="status-badge" id="hero-badge">—</span>
                </div>
                <div class="matchup">
                    <div>
                        <div class="team-name" id="away-name">—</div>
                        <div class="team-score" id="away-score">0</div>
                    </div>
                    <div class="vs-dot">VS</div>
                    <div>
                        <div class="team-name" id="home-name">—</div>
                        <div class="team-score" id="home-score">0</div>
                    </div>
                </div>
                <div class="match-meta" id="hero-meta">—</div>
                <div class="duel-line" id="duel-line" style="display:none"></div>
                <div class="play-now" id="play-now">타석 소식 대기 중</div>
            </div>

            <div class="panel" id="live-section" style="display:none">
                <div class="label">라이브 NOW</div>
                <div id="live-list"></div>
            </div>

            <div class="panel" id="myteam-home" style="display:none">
                <div class="label">내 구단 경기</div>
                <div id="myteam-home-body"></div>
            </div>
        </div>

        <!-- 경기 -->
        <div class="tab-panel" id="tab-games">
            <div class="seg" id="game-filter">
                <button type="button" class="on" data-f="all">전체</button>
                <button type="button" data-f="live">LIVE</button>
                <button type="button" data-f="scheduled">예정</button>
                <button type="button" data-f="final">종료</button>
            </div>
            <div id="games-list"></div>
        </div>

        <!-- 중계 -->
        <div class="tab-panel" id="tab-feed">
            <div class="panel">
                <div class="label">타석·득점 타임라인</div>
                <div class="timeline" id="play-timeline"></div>
            </div>
            <div class="panel">
                <div class="label">가가존 · 실시간 중계창</div>
                <input class="nick-input" id="nick" value="guest" placeholder="닉네임" style="margin-bottom:8px;width:100%">
                <div class="gaga-feed" id="gaga-feed"></div>
                <div class="emoji-bar">
                    <button type="button" class="emoji-btn" onclick="sendReaction('🔥')">🔥</button>
                    <button type="button" class="emoji-btn" onclick="sendReaction('⚾')">⚾</button>
                    <button type="button" class="emoji-btn" onclick="sendReaction('😭')">😭</button>
                    <button type="button" class="emoji-btn" onclick="sendReaction('👍')">👍</button>
                    <button type="button" class="emoji-btn" onclick="sendReaction('💀')">💀</button>
                    <button type="button" class="emoji-btn" onclick="sendReaction('😂')">😂</button>
                    <button type="button" class="emoji-btn" onclick="sendReaction('🙏')">🙏</button>
                    <button type="button" class="emoji-btn" onclick="sendReaction('👏')">👏</button>
                </div>
                <div class="input-row">
                    <input class="chat-input" id="chat-input" maxlength="120" placeholder="한 줄 응원"
                        onkeydown="if(event.key==='Enter')sendChat()">
                    <button type="button" class="chat-send" onclick="sendChat()">전송</button>
                </div>
            </div>
        </div>

        <!-- 내 구단 -->
        <div class="tab-panel" id="tab-myteam">
            <div class="panel">
                <div class="label">응원 구단 선택</div>
                <p style="font-size:0.8rem;color:var(--muted);margin-bottom:10px">
                    내 구단 경기가 홈에 먼저 뜨고, 알림·중계 필터에 쓰입니다.
                </p>
                <div class="team-grid" id="team-grid"></div>
                <div class="my-game-box" id="my-game-box">구단을 골라 주세요</div>
            </div>
        </div>

        <p class="stock-link">주식·베팅은 <a href="http://localhost:5173" id="stock-link">야구주식 웹</a>에서</p>
    </div>

    <nav class="bottom-nav">
        <button type="button" class="on" data-tab="home" onclick="goTab('home')"><span class="ico">🏠</span>홈</button>
        <button type="button" data-tab="games" onclick="goTab('games')"><span class="ico">⚾</span>경기</button>
        <button type="button" data-tab="feed" onclick="goTab('feed')"><span class="ico">📻</span>중계</button>
        <button type="button" data-tab="myteam" onclick="goTab('myteam')"><span class="ico">💙</span>내 구단</button>
    </nav>
    <div class="toast" id="toast"></div>

    <script>
        const API = '';
        const IS_DEV = location.hostname === 'localhost' && location.port === '5174';
        const STOCK_URL = IS_DEV ? 'http://localhost:5173' : `${location.origin}/stock/`;
        document.getElementById('stock-link').href = STOCK_URL;

        const KBO_TEAMS = ['KIA', 'LG', 'KT', 'SSG', 'NC', '두산', '삼성', '롯데', '한화', '키움'];
        let snapshot = null;
        let plays = [];
        let watchId = null;
        let myTeam = localStorage.getItem('my-team') || '';
        let gameFilter = 'all';
        const gagaSeen = new Set();
        const playSeen = new Set();

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2200);
        }

        function nick() {
            return document.getElementById('nick').value.trim() || 'guest';
        }

        function fmtTime(iso) {
            try {
                const d = new Date(iso);
                return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            } catch (_) { return ''; }
        }

        function fmtDate(iso) {
            try {
                const d = new Date(iso);
                return `${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`;
            } catch (_) { return '오늘'; }
        }

        function statusKo(s) {
            return s === 'live' ? 'LIVE' : s === 'final' ? '종료' : '예정';
        }

        function goTab(name) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            document.querySelectorAll('.bottom-nav button').forEach(b => {
                b.classList.toggle('on', b.dataset.tab === name);
            });
        }

        function pickGame(id) {
            watchId = id;
            localStorage.setItem('watch-game', id);
            renderHero(findGame(id));
            renderGamesList();
            toast('이 경기를 보고 있어요');
        }

        function findGame(id) {
            return snapshot?.games?.find(g => g.id === id) || null;
        }

        function resolveWatchGame() {
            const games = snapshot?.games || [];
            if (!games.length) return null;
            const saved = watchId || localStorage.getItem('watch-game');
            if (saved) {
                const g = games.find(x => x.id === saved);
                if (g) return g;
            }
            if (myTeam) {
                const mine = games.find(g => g.homeTeam === myTeam || g.awayTeam === myTeam);
                if (mine) return mine;
            }
            return games.find(g => g.status === 'live')
                || games.find(g => g.id === snapshot?.featuredGameId)
                || games[0];
        }

        function renderHero(g) {
            if (!g) return;
            watchId = g.id;
            document.getElementById('away-name').textContent = g.awayTeam;
            document.getElementById('home-name').textContent = g.homeTeam;
            document.getElementById('away-score').textContent = g.awayScore;
            document.getElementById('home-score').textContent = g.homeScore;
            document.getElementById('hero-inning').textContent = g.inning || '—';
            const badge = document.getElementById('hero-badge');
            badge.textContent = statusKo(g.status);
            badge.className = 'status-badge' + (g.status === 'live' ? ' live' : g.status === 'final' ? ' final' : '');
            const meta = [];
            if (g.stadium) meta.push(g.stadium);
            if (g.startTime) meta.push(g.startTime);
            if (g.awayPitcher || g.homePitcher) {
                meta.push(`선발 ${g.awayPitcher || '?'} vs ${g.homePitcher || '?'}`);
            }
            document.getElementById('hero-meta').textContent = meta.join(' · ') || '경기 정보';
            const duel = document.getElementById('duel-line');
            if (g.batter && g.pitcher) {
                duel.style.display = '';
                duel.innerHTML = `<strong>${g.batter}</strong> vs <strong>${g.pitcher}</strong>`;
            } else {
                duel.style.display = 'none';
            }
        }

        function renderPlayBox(play) {
            if (!play?.text) return;
            document.getElementById('play-now').innerHTML =
                `<span class="team">${play.team || 'KBO'}</span> ${play.text}`;
        }

        function renderLiveStrip() {
            const live = (snapshot?.games || []).filter(g => g.status === 'live');
            const sec = document.getElementById('live-section');
            const el = document.getElementById('live-list');
            if (!live.length) {
                sec.style.display = 'none';
                return;
            }
            sec.style.display = '';
            el.innerHTML = live.map(g => `
                <button type="button" class="game-card ${g.id === watchId ? 'active' : ''}"
                    onclick="pickGame('${g.id}')">
                    <div class="game-card-head"><span>${g.inning}</span><span class="status-badge live">LIVE</span></div>
                    <div class="game-card-body">
                        <span>${g.awayTeam} vs ${g.homeTeam}</span>
                        <span class="game-card-score">${g.awayScore}:${g.homeScore}</span>
                    </div>
                </button>`).join('');
        }

        function renderMyTeamHome() {
            const sec = document.getElementById('myteam-home');
            const el = document.getElementById('myteam-home-body');
            if (!myTeam) { sec.style.display = 'none'; return; }
            const g = (snapshot?.games || []).find(x => x.homeTeam === myTeam || x.awayTeam === myTeam);
            if (!g) {
                sec.style.display = '';
                el.innerHTML = `<div class="empty">${myTeam} 경기 없음 (오늘)</div>`;
                return;
            }
            sec.style.display = '';
            el.innerHTML = `
                <button type="button" class="game-card ${g.id === watchId ? 'active' : ''}"
                    onclick="pickGame('${g.id}')">
                    <div class="game-card-head"><span>${g.inning}</span><span class="status-badge ${g.status === 'live' ? 'live' : ''}">${statusKo(g.status)}</span></div>
                    <div class="game-card-body">
                        <span>${g.awayTeam} vs ${g.homeTeam}</span>
                        <span class="game-card-score">${g.awayScore}:${g.homeScore}</span>
                    </div>
                </button>`;
        }

        function gameCardHtml(g) {
            return `
                <button type="button" class="game-card ${g.id === watchId ? 'active' : ''}"
                    onclick="pickGame('${g.id}')">
                    <div class="game-card-head">
                        <span>${g.inning}${g.stadium ? ' · ' + g.stadium : ''}</span>
                        <span class="status-badge ${g.status === 'live' ? 'live' : g.status === 'final' ? 'final' : ''}">${statusKo(g.status)}</span>
                    </div>
                    <div class="game-card-body">
                        <span>${g.awayTeam} vs ${g.homeTeam}</span>
                        <span class="game-card-score">${g.awayScore}:${g.homeScore}</span>
                    </div>
                </button>`;
        }

        function renderGamesList() {
            let games = snapshot?.games || [];
            if (gameFilter !== 'all') games = games.filter(g => g.status === gameFilter);
            const el = document.getElementById('games-list');
            el.innerHTML = games.length
                ? games.map(gameCardHtml).join('')
                : '<div class="empty">해당 상태의 경기가 없어요</div>';
        }

        function appendPlay(play) {
            if (!play?.id || playSeen.has(play.id)) return;
            playSeen.add(play.id);
            plays.unshift(play);
            plays = plays.slice(0, 50);
            if (play.gameId === watchId || !watchId) renderPlayBox(play);
            renderTimeline();
        }

        function renderTimeline() {
            const el = document.getElementById('play-timeline');
            const list = plays.filter(p => !watchId || p.gameId === watchId);
            if (!list.length) {
                el.innerHTML = '<div class="empty">아직 타석 소식이 없어요<br>경기가 시작되면 여기에 쌓입니다</div>';
                return;
            }
            el.innerHTML = list.map(p => `
                <div class="tl-item ${p.impact === 'run' ? 'run' : ''}">
                    <span class="tl-time">${fmtTime(p.at)}</span>
                    ${p.team ? `<span class="tl-team">${p.team}</span> ` : ''}${p.text}
                </div>`).join('');
        }

        function gagaHtml(msg) {
            const t = fmtTime(msg.at);
            if (msg.kind === 'system') return `<div class="gaga-msg system">${msg.text}</div>`;
            if (msg.kind === 'reaction') return `<div class="gaga-msg reaction">${msg.emoji || msg.text}</div>`;
            if (msg.kind === 'play') {
                const team = msg.text.startsWith('[') ? msg.text.slice(1, msg.text.indexOf(']')) : '';
                const body = team ? msg.text.slice(msg.text.indexOf(']') + 2) : msg.text;
                return `<div class="gaga-msg play">${team ? `<span class="team">${team}</span> ` : ''}${body}<span class="gaga-time">${t}</span></div>`;
            }
            return `<div class="gaga-msg"><span class="gaga-user">${msg.userId || 'guest'}</span>${msg.text}<span class="gaga-time">${t}</span></div>`;
        }

        function appendGaga(msg) {
            if (!msg?.id || gagaSeen.has(msg.id)) return;
            gagaSeen.add(msg.id);
            const el = document.getElementById('gaga-feed');
            el.insertAdjacentHTML('beforeend', gagaHtml(msg));
            while (el.children.length > 80) el.removeChild(el.firstChild);
            el.scrollTop = el.scrollHeight;
        }

        function renderGagaList(messages) {
            gagaSeen.clear();
            document.getElementById('gaga-feed').innerHTML = '';
            (messages || []).slice().reverse().forEach(appendGaga);
        }

        function renderTeamGrid() {
            document.getElementById('team-grid').innerHTML = KBO_TEAMS.map(t => `
                <button type="button" class="team-pick ${t === myTeam ? 'on' : ''}"
                    onclick="setMyTeam('${t}')">${t}</button>`).join('');
            const g = myTeam
                ? (snapshot?.games || []).find(x => x.homeTeam === myTeam || x.awayTeam === myTeam)
                : null;
            const box = document.getElementById('my-game-box');
            if (!myTeam) {
                box.textContent = '구단을 골라 주세요';
            } else if (!g) {
                box.textContent = `${myTeam} — 오늘 경기 없음`;
            } else {
                box.innerHTML = `<strong>${myTeam}</strong> · ${g.awayTeam} vs ${g.homeTeam}<br>
                    ${g.inning} · <strong>${g.awayScore}:${g.homeScore}</strong> · ${statusKo(g.status)}
                    <br><button type="button" class="chat-send" style="margin-top:8px;width:100%"
                        onclick="pickGame('${g.id}');goTab('home')">이 경기 보기</button>`;
            }
        }

        function setMyTeam(team) {
            myTeam = team;
            localStorage.setItem('my-team', team);
            renderTeamGrid();
            renderMyTeamHome();
            const g = (snapshot?.games || []).find(x => x.homeTeam === team || x.awayTeam === team);
            if (g) pickGame(g.id);
            toast(`${team} 응원 구단으로 설정`);
        }

        function applySnapshot(snap) {
            if (!snap) return;
            snapshot = snap;
            document.getElementById('date-line').textContent = fmtDate(snap.updatedAt || snap.date);
            const g = resolveWatchGame();
            if (g) renderHero(g);
            renderLiveStrip();
            renderMyTeamHome();
            renderGamesList();
            renderTeamGrid();
        }

        async function refresh() {
            const [gamesRes, playsRes, commRes] = await Promise.all([
                fetch(`${API}/amm/games/today`).catch(() => null),
                fetch(`${API}/amm/games/plays?limit=30`).catch(() => null),
                fetch(`${API}/amm/community/feed?limit=40`).catch(() => null),
            ]);
            if (gamesRes?.ok) {
                const data = await gamesRes.json();
                applySnapshot(data.snapshot || {
                    games: data.featured ? [data.featured] : [],
                    featuredGameId: data.featured?.id,
                    updatedAt: new Date().toISOString(),
                });
                if (data.plays?.length) {
                    data.plays.slice().reverse().forEach(p => {
                        if (!playSeen.has(p.id)) { playSeen.add(p.id); plays.push(p); }
                    });
                    plays.sort((a, b) => new Date(b.at) - new Date(a.at));
                    plays = plays.slice(0, 50);
                    renderTimeline();
                    renderPlayBox(plays.find(p => p.gameId === watchId) || plays[0]);
                }
            }
            if (playsRes?.ok) {
                const data = await playsRes.json();
                (data.plays || []).forEach(p => {
                    if (!playSeen.has(p.id)) { playSeen.add(p.id); plays.push(p); }
                });
                plays.sort((a, b) => new Date(b.at) - new Date(a.at));
                plays = plays.slice(0, 50);
                renderTimeline();
            }
            if (commRes?.ok) {
                const comm = await commRes.json();
                renderGagaList(comm.messages);
            }
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = (input.value || '').trim();
            if (!text) return;
            socket.emit('sendChat', { userId: nick(), text, gameId: watchId }, res => {
                if (res && !res.ok) toast(res.error || '전송 실패');
            });
            input.value = '';
        }

        function sendReaction(emoji) {
            socket.emit('sendReaction', { userId: nick(), emoji }, res => {
                if (res && !res.ok) toast('잠시 후 다시 시도해 주세요');
            });
        }

        document.getElementById('game-filter').addEventListener('click', e => {
            const btn = e.target.closest('button[data-f]');
            if (!btn) return;
            gameFilter = btn.dataset.f;
            document.querySelectorAll('#game-filter button').forEach(b => b.classList.toggle('on', b === btn));
            renderGamesList();
        });

        const socket = io(IS_DEV ? undefined : { path: '/socket.io' });
        socket.on('presence', p => {
            document.getElementById('presence').textContent = `${p.liveCount}명 접속`;
        });
        socket.on('community', msg => appendGaga(msg));
        socket.on('playFeed', play => appendPlay(play));
        socket.on('gameUpdate', snap => {
            applySnapshot(snap);
            const last = plays.find(p => p.gameId === watchId);
            if (last) renderPlayBox(last);
        });

        watchId = localStorage.getItem('watch-game');
        renderTeamGrid();
        refresh();
        setInterval(refresh, 45000);
    </script>
</body>
</html>
