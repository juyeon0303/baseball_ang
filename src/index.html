<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>야구주식</title>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #f7f7f5;
            --surface: #ffffff;
            --border: #e8e8e4;
            --text: #1a1a1a;
            --muted: #6b6b6b;
            --faint: #9a9a9a;
            --accent: #1a5c3a;
            --accent-soft: #e8f3ec;
            --down: #b33a3a;
            --down-soft: #fceaea;
            --highlight: #c9a227;
            --radius: 12px;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px 16px 32px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .sync {
            font-size: 0.72rem;
            color: var(--faint);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ccc;
        }

        .dot.live { background: #3dba6a; }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }

        .panel-flat {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            margin-bottom: 16px;
        }

        .label {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .hero-name {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .hero-sub {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .hero-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            white-space: nowrap;
        }

        .hero-stat {
            margin-top: 14px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .hero-stat-val {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--text);
        }

        .hero-stat-unit {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .spark {
            height: 36px;
            margin-top: 14px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
        }

        .spark span {
            flex: 1;
            background: var(--accent-soft);
            border-radius: 2px 2px 0 0;
            min-height: 4px;
            transition: height 0.3s;
        }

        .crowd {
            margin-top: 16px;
        }

        .crowd-bar {
            height: 6px;
            background: var(--down-soft);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }

        .crowd-long {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .crowd-text {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 6px;
        }

        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .game-score {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .meta {
            font-size: 0.78rem;
            color: var(--faint);
            margin-top: 4px;
        }

        .king-line {
            font-size: 0.88rem;
            color: var(--text);
        }

        .king-line strong {
            color: var(--highlight);
            font-weight: 600;
        }

        .feed-list {
            list-style: none;
        }

        .feed-list li {
            font-size: 0.82rem;
            color: var(--muted);
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .feed-list li:last-child { border-bottom: none; }

        .feed-action {
            color: var(--text);
            font-weight: 500;
        }

        .trade-form label {
            display: block;
            font-size: 0.72rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .field {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }

        .field:focus {
            border-color: var(--accent);
            background: #fff;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 72px;
            gap: 8px;
        }

        .btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .btn {
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn:active { opacity: 0.85; }

        .btn-long {
            background: var(--accent);
            color: #fff;
        }

        .btn-short {
            background: var(--down-soft);
            color: var(--down);
            border: 1px solid #f0d0d0;
        }

        .me-line {
            text-align: center;
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .section-toggle {
            width: 100%;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.82rem;
            padding: 10px 0;
            cursor: pointer;
            text-align: center;
        }

        .lineup {
            display: none;
        }

        .lineup.open { display: block; }

        .lineup-item {
            display: grid;
            grid-template-columns: 44px 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .lineup-item:last-child { border-bottom: none; }

        .lineup-item.active .lineup-name { color: var(--accent); font-weight: 600; }

        .lineup-team {
            font-size: 0.72rem;
            color: var(--faint);
        }

        .lineup-name {
            font-size: 0.88rem;
        }

        .lineup-stat {
            font-size: 0.82rem;
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            text-align: right;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: var(--text);
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div class="logo">야구주식</div>
            <div class="sync"><span class="dot" id="sync-dot"></span><span id="sync-text">연결 중</span></div>
        </header>

        <section class="panel" id="hero">
            <div class="label">Featured</div>
            <div class="hero-top">
                <div>
                    <div class="hero-name" id="hero-name">이정후</div>
                    <div class="hero-sub" id="hero-sub">MLB · OPS</div>
                </div>
                <div class="hero-price" id="hero-price">—</div>
            </div>
            <div class="hero-stat">
                <span class="hero-stat-val" id="hero-ops">—</span>
                <span class="hero-stat-unit" id="hero-metric">OPS</span>
            </div>
            <div class="spark" id="spark"></div>
            <div class="crowd">
                <div class="label" style="margin-bottom:0">군중 심리</div>
                <div class="crowd-bar"><div class="crowd-long" id="crowd-long" style="width:50%"></div></div>
                <div class="crowd-text" id="crowd-text">롱 50% · 숏 50%</div>
            </div>
        </section>

        <section class="panel" id="game-card">
            <div class="row-between">
                <span id="game-line">오늘의 경기</span>
                <span class="game-score" id="game-score">—</span>
            </div>
            <div class="meta" id="live-line">접속 —명</div>
        </section>

        <section class="panel">
            <div class="label">이번 주 1위</div>
            <div class="king-line" id="crown">—</div>
        </section>

        <section class="panel">
            <div class="label">최근 체결</div>
            <ul class="feed-list" id="feed"></ul>
        </section>

        <section class="panel trade-form">
            <div class="field-row">
                <div>
                    <label for="user-id">닉네임</label>
                    <input class="field" id="user-id" value="guest" onchange="onUserChange()">
                </div>
                <div>
                    <label for="qty">수량</label>
                    <input class="field" type="number" id="qty" value="5" min="1">
                </div>
            </div>
            <div class="btns">
                <button class="btn btn-long" onclick="order('buy','long')">롱 매수</button>
                <button class="btn btn-short" onclick="order('sell','short')">숏</button>
            </div>
            <div class="me-line" id="me-line">내 수익 —</div>
        </section>

        <button class="section-toggle" id="toggle-lineup" onclick="toggleLineup()">10개 종목 보기</button>
        <section class="panel lineup" id="lineup-panel">
            <div id="lineup-list"></div>
        </section>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const API = '';
        let selectedId = 'lee-jung-hoo';
        let hub = null;
        let lineupOpen = false;

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2200);
        }

        function userId() {
            return document.getElementById('user-id').value.trim() || 'guest';
        }

        function fmtPct(n) {
            const v = Number(n);
            return (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
        }

        function actionKo(a) {
            return { open_long: '롱', close_long: '매도', open_short: '숏', close_short: '숏청산' }[a] || a;
        }

        function renderSpark(history) {
            const el = document.getElementById('spark');
            const prices = (history || []).map(h => h.price).slice(-24);
            if (prices.length < 2) {
                el.innerHTML = '';
                return;
            }
            const min = Math.min(...prices);
            const max = Math.max(...prices);
            const range = max - min || 1;
            el.innerHTML = prices.map(p => {
                const h = 8 + Math.round(((p - min) / range) * 28);
                return `<span style="height:${h}px"></span>`;
            }).join('');
        }

        function renderHub(data) {
            hub = data;
            const inst = data.instrument;
            selectedId = data.featuredId;

            document.getElementById('hero-name').textContent = inst.playerName;
            document.getElementById('hero-sub').textContent =
                `${inst.teamShort} · ${inst.metricLabel}`;
            document.getElementById('hero-price').textContent =
                inst.price.toLocaleString() + ' P';
            document.getElementById('hero-ops').textContent =
                Number(inst.oracleValue).toFixed(3);
            document.getElementById('hero-metric').textContent = inst.metricLabel;

            const lp = data.crowd.longPct;
            document.getElementById('crowd-long').style.width = lp + '%';
            document.getElementById('crowd-text').textContent =
                `롱 ${lp}% · 숏 ${data.crowd.shortPct}%`;

            const g = data.game;
            document.getElementById('game-line').textContent =
                `${g.awayTeam} vs ${g.homeTeam} · ${g.inning}`;
            document.getElementById('game-score').textContent =
                `${g.awayScore} : ${g.homeScore}`;
            document.getElementById('live-line').textContent =
                `${data.liveCount}명 접속`;

            const king = data.weekKing;
            document.getElementById('crown').innerHTML = king
                ? `<strong>${king.userId}</strong> · 주간 ${fmtPct(king.weeklyReturnPct)}`
                : '아직 없음';

            const feed = document.getElementById('feed');
            feed.innerHTML = data.recentTrades.length
                ? data.recentTrades.map(t => `
                    <li>
                        <span>${t.userId.slice(0, 10)}</span>
                        <span><span class="feed-action">${actionKo(t.action)}</span> · ${t.price.toLocaleString()}P</span>
                    </li>`).join('')
                : '<li>아직 체결 없음</li>';

            if (data.me) {
                document.getElementById('me-line').textContent =
                    `주간 ${fmtPct(data.me.weeklyReturnPct)} · ${data.me.rank ?? '—'}위 · 잔고 ${data.me.equity.toLocaleString()}P`;
            }
        }

        function renderLineup(items) {
            document.getElementById('lineup-list').innerHTML = items.map(i => `
                <div class="lineup-item ${i.instrumentId === selectedId ? 'active' : ''}"
                     onclick="selectStock('${i.instrumentId}')">
                    <span class="lineup-team">${i.teamShort}</span>
                    <span class="lineup-name">${i.playerName}</span>
                    <span class="lineup-stat">${i.oracleValue.toFixed(3)}</span>
                </div>`).join('');
        }

        async function loadSpark(instrumentId) {
            try {
                const res = await fetch(`${API}/amm/status?instrumentId=${instrumentId}`);
                const data = await res.json();
                renderSpark(data.priceHistory);
            } catch (_) {}
        }

        async function refresh() {
            const [hubRes, lineupRes, syncRes] = await Promise.all([
                fetch(`${API}/amm/hub?userId=${encodeURIComponent(userId())}`),
                fetch(`${API}/amm/lineup`),
                fetch(`${API}/amm/live-stats`).catch(() => null),
            ]);
            const hubData = await hubRes.json();
            const lineup = await lineupRes.json();
            renderHub(hubData);
            renderLineup(lineup);
            await loadSpark(selectedId);

            if (syncRes?.ok) {
                const sync = await syncRes.json();
                const n = sync.last?.updated?.length ?? 0;
                const dot = document.getElementById('sync-dot');
                const txt = document.getElementById('sync-text');
                if (n > 0) {
                    dot.classList.add('live');
                    const t = sync.last.finishedAt
                        ? new Date(sync.last.finishedAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                        : '';
                    txt.textContent = `실시간 ${n}종목 · ${t}`;
                } else {
                    txt.textContent = '동기화 대기';
                }
            }
        }

        async function selectStock(instrumentId) {
            selectedId = instrumentId;
            const res = await fetch(`${API}/amm/market/${instrumentId}`);
            const inst = await res.json();
            document.getElementById('hero-name').textContent = inst.playerName;
            document.getElementById('hero-sub').textContent =
                `${inst.teamShort} · ${inst.metricLabel}`;
            document.getElementById('hero-price').textContent =
                inst.price.toLocaleString() + ' P';
            document.getElementById('hero-ops').textContent =
                Number(inst.oracleValue).toFixed(3);
            document.getElementById('hero-metric').textContent = inst.metricLabel;
            const lineup = await (await fetch(`${API}/amm/lineup`)).json();
            renderLineup(lineup);
            await loadSpark(instrumentId);
            toast(`${inst.playerName} 선택`);
        }

        async function order(type, side) {
            const qty = parseInt(document.getElementById('qty').value, 10);
            const res = await fetch(`${API}/amm/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: userId(),
                    instrumentId: selectedId,
                    quantity: qty,
                    side,
                }),
            });
            const data = await res.json();
            if (!res.ok) return toast(data.message || '체결 실패');
            toast(`${side === 'long' ? '롱' : '숏'} 체결`);
            refresh();
        }

        function onUserChange() { refresh(); }

        function toggleLineup() {
            lineupOpen = !lineupOpen;
            document.getElementById('lineup-panel').classList.toggle('open', lineupOpen);
            document.getElementById('toggle-lineup').textContent =
                lineupOpen ? '종목 접기' : '10개 종목 보기';
        }

        const socket = io();
        socket.on('presence', p => {
            document.getElementById('live-line').textContent = `${p.liveCount}명 접속`;
        });
        socket.on('priceUpdate', item => {
            if (item.id !== selectedId) return;
            document.getElementById('hero-price').textContent =
                item.price.toLocaleString() + ' P';
            if (item.oracleValue != null) {
                document.getElementById('hero-ops').textContent =
                    Number(item.oracleValue).toFixed(3);
            }
        });
        socket.on('tradeFeed', () => refresh());

        refresh();
        setInterval(refresh, 30000);
    </script>
</body>

</html>
